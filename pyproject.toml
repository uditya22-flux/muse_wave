[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musewave"
version = "2.0.0"
description = "Touchless Media Daemon for Linux & Windows — Bilingual Voice (en-IN / ml-IN), 3D Hand Gestures & Spicetify IPC"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Uditya Krishna" }
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "SpeechRecognition>=3.10.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/uditya22-flux/spotify__"
Repository = "https://github.com/uditya22-flux/spotify__.git"

[project.scripts]
musewave = "main:main"
musewave-train = "gesture_trainer:main"
