<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" height="310">
  <!-- Flat terminal window -->
  <rect width="960" height="310" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top window bar -->
  <rect x="1" y="1" width="958" height="26" rx="5" fill="#161b22"/>
  <line x1="0" y1="27" x2="960" y2="27" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
    tmux: [0:main.py*] [1:pose_solver]
  </text>
  <text x="944" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681" text-anchor="end">
    tty1 · utf-8
  </text>

  <!-- Vertical pane split -->
  <line x1="630" y1="27" x2="630" y2="286" stroke="#30363d" stroke-width="1"/>

  <!-- Left Pane: stdout log stream -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    <text x="18" y="52" fill="#c9d1d9">$ ./venv/bin/python main.py</text>
    <text x="18" y="74" fill="#6e7681">07:45:01.104 INFO  sys.init      :: daemon started (pid=41892)</text>
    <text x="18" y="94" fill="#6e7681">07:45:01.112 INFO  audio.vad     :: pcm capture [16000Hz S16_LE mono]</text>
    <text x="18" y="114" fill="#8b949e">07:45:01.120 INFO  video.v4l2    :: /dev/video0 unattached (camera off)</text>
    <text x="18" y="134" fill="#6e7681">07:45:01.125 INFO  ipc.spicetify :: listening on 127.0.0.1:19745</text>

    <!-- Step 1 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.14;0.18;0.88;0.95;1" dur="10s" repeatCount="indefinite"/>
      <text x="18" y="164" fill="#c9d1d9">07:45:04.210 ASR   [ml-IN]       :: "അടുത്ത പാട്ട്" (adutha pattu)</text>
      <text x="18" y="184" fill="#3fb950">07:45:04.214 EXEC  mpris.spotify :: Next() -&gt; ok</text>
    </g>

    <!-- Step 2 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.38;0.42;0.88;0.95;1" dur="10s" repeatCount="indefinite"/>
      <text x="18" y="214" fill="#c9d1d9">07:45:07.890 ASR   [en-IN]       :: "camera on"</text>
      <text x="18" y="234" fill="#8b949e">07:45:07.902 V4L2  /dev/video0   :: capture opened (640x480 @ 30fps)</text>
    </g>

    <!-- Step 3 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.62;0.66;0.88;0.95;1" dur="10s" repeatCount="indefinite"/>
      <text x="18" y="264" fill="#3fb950">07:45:10.440 POSE  knn.90d       :: match="next" (d=0.028, collinear=0.98)</text>
    </g>

    <!-- Subtle terminal cursor -->
    <rect x="18" y="271" width="7" height="12" fill="#8b949e">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right Pane: Minimal wireframe plot -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <text x="648" y="50" fill="#6e7681">pose_vector[90] // wrist_norm</text>

    <!-- Minimalist wireframe hand (monochrome gray + muted green active tips) -->
    <g stroke="#484f58" stroke-width="1.5" fill="none">
      <polyline points="795,225 750,195 732,170 722,152"/>
      <polyline points="795,225 770,165 766,125 764,95"/>
      <polyline points="795,225 794,160 794,118 794,85"/>
      <polyline points="795,225 816,168 822,145 824,134"/>
      <polyline points="795,225 836,178 844,158 846,146"/>
      <polyline points="770,165 794,160 816,168 836,178" stroke="#30363d" stroke-width="1"/>
    </g>

    <!-- Landmarks -->
    <g fill="#8b949e">
      <circle cx="795" cy="225" r="3" fill="#c9d1d9"/>
      <circle cx="750" cy="195" r="2.5"/>
      <circle cx="732" cy="170" r="2.5"/>
      <circle cx="722" cy="152" r="2.5"/>
      <circle cx="770" cy="165" r="2.5"/>
      <circle cx="766" cy="125" r="2.5"/>
      <circle cx="764" cy="95" r="3.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="794" cy="160" r="2.5"/>
      <circle cx="794" cy="118" r="2.5"/>
      <circle cx="794" cy="85" r="3.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="816" cy="168" r="2.5"/>
      <circle cx="822" cy="145" r="2.5"/>
      <circle cx="824" cy="134" r="2.5"/>
      <circle cx="836" cy="178" r="2.5"/>
      <circle cx="844" cy="158" r="2.5"/>
      <circle cx="846" cy="146" r="2.5"/>
    </g>

    <!-- Raw numeric readout -->
    <text x="648" y="254" fill="#8b949e">class:  "next" (2-finger)</text>
    <text x="648" y="272" fill="#6e7681">cosine: 0.972  |  hold: 150ms</text>
  </g>

  <!-- Bottom tmux status line -->
  <rect x="1" y="286" width="958" height="23" rx="4" fill="#161b22"/>
  <line x1="0" y1="286" x2="960" y2="286" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#6e7681">
    [musewave] 0:python3*                                                        "127.0.0.1:19745"  0.4% CPU  42MB RSS
  </text>
</svg>
