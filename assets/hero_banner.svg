<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210">
  <!-- Clean flat terminal frame -->
  <rect width="960" height="210" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top status bar (tmux style) -->
  <rect x="1" y="1" width="958" height="26" rx="5" fill="#161b22"/>
  <line x1="0" y1="27" x2="960" y2="27" stroke="#30363d" stroke-width="1"/>
  <circle cx="18" cy="14" r="3.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
    musewave.service — active (running) — pid 41892
  </text>
  <text x="944" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681" text-anchor="end">
    v2.0.0 | linux-x86_64 · win32
  </text>

  <!-- Minimalist Developer Typography -->
  <text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700" fill="#e6edf3" letter-spacing="4">
    musewave
  </text>
  <text x="275" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#6e7681">
    // local audio &amp; hand-pose media daemon
  </text>

  <text x="40" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#8b949e">
    alsa/pipewire 16kHz vad · bilingual asr (en-IN / ml-IN) · 90-d mediapipe k-nn · mpris2 &amp; spicetify ipc
  </text>

  <!-- Subtle terminal metadata tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#c9d1d9">
    <rect x="40" y="134" width="148" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="50" y="149" fill="#8b949e">mic:</text>
    <text x="82" y="149" fill="#c9d1d9">16kHz S16_LE</text>

    <rect x="198" y="134" width="154" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="208" y="149" fill="#8b949e">cam:</text>
    <text x="240" y="149" fill="#c9d1d9">/dev/video0 off</text>

    <rect x="362" y="134" width="166" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="372" y="149" fill="#8b949e">ipc:</text>
    <text x="404" y="149" fill="#c9d1d9">127.0.0.1:19745</text>

    <rect x="538" y="134" width="130" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="548" y="149" fill="#8b949e">license:</text>
    <text x="606" y="149" fill="#c9d1d9">MIT</text>
  </g>

  <!-- Subtle monochrome PCM dB meter at bottom -->
  <text x="40" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#6e7681">
    pcm_rms [-38.4 dB]
  </text>
  <g fill="#30363d">
    <rect x="165" y="179" width="6" height="10" fill="#3fb950"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="175" y="179" width="6" height="10" fill="#3fb950"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="185" y="179" width="6" height="10" fill="#3fb950"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="195" y="179" width="6" height="10" fill="#3fb950"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="205" y="179" width="6" height="10" fill="#2ea043"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="215" y="179" width="6" height="10" fill="#2ea043"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="225" y="179" width="6" height="10" fill="#2ea043"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="0.85s" repeatCount="indefinite"/></rect>
    <rect x="235" y="179" width="6" height="10" fill="#238636"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="245" y="179" width="6" height="10" fill="#21262d"/>
    <rect x="255" y="179" width="6" height="10" fill="#21262d"/>
    <rect x="265" y="179" width="6" height="10" fill="#21262d"/>
    <rect x="275" y="179" width="6" height="10" fill="#21262d"/>
  </g>
</svg>
