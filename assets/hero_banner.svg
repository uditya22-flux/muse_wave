<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#070b0a"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#1DB954" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1DB954" stroke-width="0.4" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background & Cyber Grid -->
  <rect width="960" height="280" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="960" height="280" rx="10" fill="url(#grid)"/>

  <!-- Animated Scanning Laser Line -->
  <line x1="0" y1="0" x2="960" y2="0" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.35">
    <animate attributeName="y1" values="0;280;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;280;0" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- Top Telemetry Bar -->
  <rect x="16" y="14" width="928" height="28" rx="4" fill="#0d131c" stroke="#1e293b" stroke-width="1"/>
  <circle cx="32" cy="28" r="4.5" fill="#1DB954">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="45" y="32" font-family="monospace" font-size="11" fill="#94a3b8" letter-spacing="1">
    DAEMON::ONLINE // PID:41892 // IPC:127.0.0.1:19745
  </text>
  <text x="930" y="32" font-family="monospace" font-size="11" fill="#00F0FF" text-anchor="end" letter-spacing="1">
    [ LINUX_X86_64 | WIN32_NT | MIT ]
  </text>

  <!-- Main Glitch/Cyber Title -->
  <g filter="url(#glow)">
    <text x="480" y="112" font-family="monospace" font-size="56" font-weight="bold" fill="url(#neonGreen)" text-anchor="middle" letter-spacing="14">
      MUSEWAVE
    </text>
  </g>

  <!-- Subtitle -->
  <text x="480" y="144" font-family="monospace" font-size="13.5" fill="#e2e8f0" text-anchor="middle" letter-spacing="2.5">
    MULTIMODAL VOICE ASR (EN-IN / ML-IN) &amp; 90-D HAND-SKELETON MEDIA DAEMON
  </text>

  <!-- Status Pills -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="135" y="162" width="160" height="24" rx="3" fill="#091914" stroke="#1DB954" stroke-width="1"/>
    <text x="215" y="178" fill="#1DB954">MIC: 16kHz PCM VAD</text>

    <rect x="310" y="162" width="165" height="24" rx="3" fill="#091520" stroke="#00F0FF" stroke-width="1"/>
    <text x="392" y="178" fill="#00F0FF">CAM: HW-LOCKED OFF</text>

    <rect x="490" y="162" width="165" height="24" rx="3" fill="#091914" stroke="#1DB954" stroke-width="1"/>
    <text x="572" y="178" fill="#1DB954">POSE: 21x3D COSINE</text>

    <rect x="670" y="162" width="155" height="24" rx="3" fill="#091520" stroke="#00F0FF" stroke-width="1"/>
    <text x="747" y="178" fill="#00F0FF">BRIDGE: SPICETIFY</text>
  </g>

